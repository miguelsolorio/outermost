# Builds the site and deploys it to GitHub Pages. Processed assets (textures,
# catalogs) come from the newest `assets-*` GitHub Release made with
# `npm run pack`, so CI never needs the 5 GB of raw sources or the pipeline tools.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Fetch processed assets
        run: node tools/pack/pull.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Fact-check and unit tests
        run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          # Absolute origin for the og:image and og:url tags in index.html.
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
