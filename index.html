<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Explore the observable universe to scale, from planetary surfaces to the cosmic microwave background, built from NASA, ESA, USGS and IAU data." />
    <title>Outermost</title>
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- VITE_SITE_URL is the deployed origin (set in CI): crawlers need absolute image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Outermost" />
    <meta property="og:title" content="Outermost" />
    <meta property="og:description" content="Explore the observable universe to scale, from planetary surfaces to the cosmic microwave background, built from NASA, ESA, USGS and IAU data." />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The night side of Earth from orbit, with city lights across North America and the Sun rising over the limb." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <!-- Google Analytics, on the deployed site only. The hash holds live camera state, so it is left out of page_location. -->
    <script>
      if (location.hostname.endsWith('github.io')) {
        const s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PDB3DT24E5';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag('js', new Date());
        gtag('config', 'G-PDB3DT24E5', { page_location: location.origin + location.pathname });
      }
    </script>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
